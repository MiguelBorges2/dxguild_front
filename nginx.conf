# HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;

    server_name dxguild.com.br www.dxguild.com.br;

    return 301 https://$host$request_uri;
}

# HTTPS
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name dxguild.com.br www.dxguild.com.br;

    ssl_certificate /etc/letsencrypt/live/dxguild.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dxguild.com.br/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /dxguild/ {
        proxy_pass http://dxback:8080;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /dx-rpg {
        proxy_pass http://dxback:8080;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}