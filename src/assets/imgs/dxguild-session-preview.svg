<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title"><title id="title">Prévia ilustrativa de conversa e rolagem de dados da mesa</title><g font-family="Segoe UI, Arial, sans-serif"><rect x="1" y="1" width="959" height="599" rx="12" fill="#101211" stroke="#343831"/><path d="M1 66H959 M633 66V599" stroke="#343831"/><g transform="translate(25 24) scale(0.9583333333333334)" fill="none" stroke="#e2ba61" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3H21V17H10L4 22V17H3Z"/></g><text x="61" y="43" font-size="22" fill="#f4f2eb" font-weight="600">Uma história, muitas vozes.</text><text x="727" y="42" font-size="12" fill="#aab0a9" font-weight="600">PRÉVIA ILUSTRATIVA</text><circle cx="42" cy="121" r="19" fill="#38483d"/><text x="36" y="127" font-size="17" fill="#e2ba61" font-weight="600">R</text><text x="77" y="115" font-size="18" fill="#c7b78f" font-weight="600">Rafael · Mestre</text><text x="77" y="144" font-size="19" fill="#f4f2eb" font-weight="400">A névoa se adensa e o som de cascos</text><text x="77" y="170" font-size="19" fill="#f4f2eb" font-weight="400">ecoa ao longe. Vocês seguem em direção</text><text x="77" y="196" font-size="19" fill="#f4f2eb" font-weight="400">ao castelo.</text><circle cx="42" cy="262" r="19" fill="#38483d"/><text x="36" y="268" font-size="17" fill="#e2ba61" font-weight="600">L</text><text x="77" y="256" font-size="18" fill="#c7b78f" font-weight="600">Lia</text><text x="77" y="285" font-size="19" fill="#f4f2eb" font-weight="400">Vou me manter atenta, procurando</text><text x="77" y="311" font-size="19" fill="#f4f2eb" font-weight="400">por movimentos nas sombras.</text><circle cx="42" cy="379" r="19" fill="#38483d"/><text x="36" y="385" font-size="17" fill="#e2ba61" font-weight="600">B</text><text x="77" y="373" font-size="18" fill="#c7b78f" font-weight="600">Bruno</text><text x="77" y="402" font-size="19" fill="#f4f2eb" font-weight="400">Quero investigar a área em busca</text><text x="77" y="428" font-size="19" fill="#f4f2eb" font-weight="400">de pistas.</text><rect x="24" y="517" width="584" height="57" rx="5" fill="#191c1a" stroke="#343831"/><text x="41" y="552" font-size="19" fill="#aab0a9" font-weight="400">Envie uma mensagem...</text><rect x="548" y="525" width="49" height="41" rx="5" fill="#e2ba61" stroke="#e2ba61"/><path d="m561 536 21 9-21 9 5-9Z" stroke="#101211" fill="none" stroke-width="2"/><text x="660" y="108" font-size="20" fill="#f4f2eb" font-weight="600">Rolagem de dados</text><rect x="657" y="130" width="277" height="43" rx="8" fill="#191c1a" stroke="#343831"/><text x="673" y="158" font-size="18" fill="#aab0a9" font-weight="400">d20</text><g transform="translate(724 201) scale(1.8)" fill="none" stroke="#e2ba61" stroke-width="2" stroke-linejoin="round"><path d="M40 2 76 23 76 65 40 86 4 65 4 23Z M40 2 22 29 58 29Z M4 23 22 29 4 65 M76 23 58 29 76 65 M4 65 24 62 40 86 56 62 76 65 M22 29 24 62 56 62 58 29Z M24 62 40 86 M22 29 4 23 M58 29 76 23"/><text x="40" y="54" font-size="23" text-anchor="middle" fill="#e2ba61" stroke="none" font-family="Arial" font-weight="700">18</text></g><rect x="657" y="393" width="277" height="75" rx="8" fill="#24241c" stroke="#343831"/><text x="677" y="424" font-size="18" fill="#aab0a9" font-weight="400">Lia rolou 1d20</text><text x="882" y="440" font-size="32" fill="#e2ba61" font-weight="700">18</text><g transform="translate(661 506) scale(1.0416666666666667)" fill="none" stroke="#e2ba61" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6H10L13 9H22V21H2Z M2 6V3H9L12 6H22V9"/></g><text x="700" y="526" font-size="16" fill="#aab0a9" font-weight="400">Materiais sempre à mão</text></g></svg>