<svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="mesa1-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b4513;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5c2e0e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="mesa1-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4af37;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b8860b;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="300" height="200" fill="url(#mesa1-bg)"/>
  
  <!-- Table top (oval/circular) -->
  <ellipse cx="150" cy="110" rx="90" ry="70" fill="#3d2817" stroke="#d4af37" stroke-width="3"/>
  
  <!-- Table reflection/shine -->
  <ellipse cx="130" cy="90" rx="50" ry="30" fill="#d4af37" opacity="0.2"/>
  
  <!-- Candlelight effect -->
  <circle cx="150" cy="110" r="40" fill="#f0e68c" opacity="0.1"/>
  <circle cx="150" cy="110" r="25" fill="#d4af37" opacity="0.15"/>
  
  <!-- Dice on table -->
  <rect x="100" y="85" width="20" height="20" fill="#ff6b6b" stroke="#d4af37" stroke-width="1"/>
  <text x="110" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#d4af37">20</text>
  
  <rect x="180" y="120" width="20" height="20" fill="#4ecdc4" stroke="#d4af37" stroke-width="1" transform="rotate(15 190 130)"/>
  <text x="190" y="135" text-anchor="middle" font-size="14" font-weight="bold" fill="#d4af37">12</text>
  
  <!-- Character sheet pages -->
  <rect x="130" y="130" width="35" height="25" fill="#f5deb3" stroke="#8b7500" stroke-width="1"/>
  <line x1="135" y1="135" x2="160" y2="135" stroke="#8b7500" stroke-width="0.5"/>
  <line x1="135" y1="141" x2="160" y2="141" stroke="#8b7500" stroke-width="0.5"/>
</svg>