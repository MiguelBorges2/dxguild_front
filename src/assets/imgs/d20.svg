<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="d20-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0e68c;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#d4af37;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b7500;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.5"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Shadow -->
  <ellipse cx="100" cy="170" rx="50" ry="15" fill="rgba(0,0,0,0.3)"/>
  
  <!-- Main d20 body (simplified icosahedron) -->
  <g filter="url(#shadow)">
    <!-- Top point -->
    <polygon points="100,30 130,60 70,60" fill="url(#d20-gradient)" stroke="#6b5a00" stroke-width="1"/>
    
    <!-- Upper left faces -->
    <polygon points="70,60 50,95 85,80" fill="#e6c200" stroke="#6b5a00" stroke-width="1"/>
    <polygon points="70,60 85,80 100,65" fill="#d4af37" stroke="#6b5a00" stroke-width="1"/>
    
    <!-- Upper right faces -->
    <polygon points="130,60 115,80 150,95" fill="#e6c200" stroke="#6b5a00" stroke-width="1"/>
    <polygon points="130,60 100,65 115,80" fill="#d4af37" stroke="#6b5a00" stroke-width="1"/>
    
    <!-- Middle left faces -->
    <polygon points="50,95 40,130 70,120" fill="#c9a961" stroke="#6b5a00" stroke-width="1"/>
    <polygon points="85,80 70,120 100,110" fill="#d4af37" stroke="#6b5a00" stroke-width="1"/>
    
    <!-- Middle right faces -->
    <polygon points="150,95 160,130 130,120" fill="#c9a961" stroke="#6b5a00" stroke-width="1"/>
    <polygon points="115,80 100,110 130,120" fill="#d4af37" stroke="#6b5a00" stroke-width="1"/>
    
    <!-- Bottom section faces -->
    <polygon points="70,120 100,110 85,145" fill="#b8942d" stroke="#6b5a00" stroke-width="1"/>
    <polygon points="130,120 100,110 115,145" fill="#b8942d" stroke="#6b5a00" stroke-width="1"/>
    
    <!-- Bottom left -->
    <polygon points="40,130 50,160 70,145" fill="#a8821a" stroke="#6b5a00" stroke-width="1"/>
    <polygon points="70,120 50,160 85,145" fill="#c9a961" stroke="#6b5a00" stroke-width="1"/>
    
    <!-- Bottom right -->
    <polygon points="160,130 150,160 130,145" fill="#a8821a" stroke="#6b5a00" stroke-width="1"/>
    <polygon points="130,120 150,160 115,145" fill="#c9a961" stroke="#6b5a00" stroke-width="1"/>
    
    <!-- Bottom point -->
    <polygon points="85,145 115,145 100,170" fill="#8b7500" stroke="#6b5a00" stroke-width="1"/>
  </g>
  
  <!-- Numbers/texture on top -->
  <text x="100" y="55" text-anchor="middle" font-size="18" font-weight="bold" fill="#6b5a00" font-family="'Cinzel', serif">20</text>
  
  <!-- Shine/highlight -->
  <circle cx="85" cy="75" r="8" fill="white" opacity="0.3" filter="url(#glow)"/>
</svg>